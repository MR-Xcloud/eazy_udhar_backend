# Reverse proxy admin.eazyudhar.com -> Node admin panel (127.0.0.1:3100)
#
# Install (as root):
#   cp deploy/admin.eazyudhar.com.nginx.conf \
#      /var/webuzo-data/nginx/custom/domains/admin.eazyudhar.com.conf
#   /usr/local/apps/nginx/sbin/nginx -t && /usr/local/apps/nginx/sbin/nginx -s reload
#
# Same pattern as api.eazyudhar.com.conf: `^~` beats Webuzo PHP/static locations
# so SPA deep links (/subscriptions/plans etc.) work on refresh.

client_max_body_size 20M;

location ^~ /assets/ {
    alias /home/deveazy/admin-panel-output/public/assets/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
}

location ^~ / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;
}
