# /etc/nginx/sites-available/eazyudhar
# Replace api.yourdomain.com with your VPS domain or IP.
# Then: sudo ln -s /etc/nginx/sites-available/eazyudhar /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

upstream eazyudhar_backend {
    server 127.0.0.1:8099;
    keepalive 32;
}

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/eazyudhar/easyudhar/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/eazyudhar/easyudhar/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://eazyudhar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

# After certbot:
# sudo certbot --nginx -d api.yourdomain.com
# Ensure BEHIND_HTTPS_PROXY=true in .env
